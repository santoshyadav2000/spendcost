apiVersion: v2
name: costmanagement
description: |
  Umbrella Helm chart for the CloudCost platform (Azure Cost Management).
  Bundles the FastAPI backend, the React/nginx frontend, and a self-contained
  PostgreSQL database. Fully values-driven and offline/air-gap friendly.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - cloudcost
  - fastapi
  - react
  - postgresql
  - azure
maintainers:
  - name: Infrashift

# Subcharts. Each is toggled via its own `<name>.enabled` flag so you can
# install any subset (e.g. use an external DB by disabling `database`).
dependencies:
  - name: database
    version: "0.1.0"
    repository: "file://charts/database"
    condition: database.enabled
  - name: backend
    version: "0.1.0"
    repository: "file://charts/backend"
    condition: backend.enabled
  - name: frontend
    version: "0.1.0"
    repository: "file://charts/frontend"
    condition: frontend.enabled
