apiVersion: v2
name: costmanagement
description: |
  Umbrella Helm chart for the CloudCost platform (Azure Cost Management).
  Bundles the FastAPI backend, the React/nginx frontend, and a self-contained
  PostgreSQL database. Fully values-driven and offline/air-gap friendly.
type: application
version: 0.1.5
appVersion: "1.0.0"
keywords:
  - cloudcost
  - fastapi
  - react
  - postgresql
  - azure
maintainers:
  - name: Infrashift

# Subcharts. Backend and frontend always install. The database subchart only
# renders when global.database.existingDatabase is false (gated inside its templates).
dependencies:
  - name: database
    version: "0.1.5"
    repository: "file://charts/database"
  - name: backend
    version: "0.1.5"
    repository: "file://charts/backend"
  - name: frontend
    version: "0.1.5"
    repository: "file://charts/frontend"
