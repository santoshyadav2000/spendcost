{{- $db := .Values.global.database -}}
{{- if not $db.existingDatabase }}
# ============================================================================
# PostgreSQL credentials for the database THIS CHART deploys.
# These are defined HERE (not in values.yaml). After install, view them with:
#   kubectl -n <namespace> get secret {{ include "database.secretName" . }} -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
# The backend reads these same values from this Secret to build its DATABASE_URL.
# (For an EXISTING database, set existingDatabase: true and put the
#  connection/password in values.yaml instead — this Secret is not created.)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "database.secretName" . }}
  namespace: {{ include "database.namespace" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: "cloudcost"
  POSTGRES_PASSWORD: "changeme"
  POSTGRES_DB: "cloudcost_db"
{{- end }}
