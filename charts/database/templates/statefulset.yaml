{{- $db := .Values.global.database -}}
{{- if not $db.existingDatabase }}
{{- $usesClaimTemplate := and $db.persistence.enabled (not $db.persistence.existingClaim) (has $db.persistence.type (list "pvc" "azureDisk" "azureFile" "azureBlob")) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "database.fullname" . }}
  namespace: {{ include "database.namespace" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "database.headlessService" . }}
  replicas: {{ $db.replicaCount }}
  selector:
    matchLabels:
      {{- include "database.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "database.labels" . | nindent 8 }}
    spec:
      {{- with $db.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $db.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "database.image" . }}
          imagePullPolicy: {{ include "database.pullPolicy" . }}
          {{- with $db.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "database.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "database.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "database.secretName" . }}
                  key: POSTGRES_DB
            - name: PGDATA
              value: {{ printf "%s/%s" $db.persistence.mountPath $db.persistence.subPath | quote }}
          {{- if $db.probes.enabled }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: {{ $db.probes.initialDelaySeconds }}
            periodSeconds: {{ $db.probes.periodSeconds }}
            timeoutSeconds: {{ $db.probes.timeoutSeconds }}
            failureThreshold: {{ $db.probes.failureThreshold }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -h 127.0.0.1"]
            initialDelaySeconds: {{ add $db.probes.initialDelaySeconds 15 }}
            periodSeconds: {{ $db.probes.periodSeconds }}
            timeoutSeconds: {{ $db.probes.timeoutSeconds }}
            failureThreshold: {{ $db.probes.failureThreshold }}
          {{- end }}
          {{- with $db.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ $db.persistence.mountPath }}
      {{- if not $usesClaimTemplate }}
      volumes:
        - name: data
          {{- if $db.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $db.persistence.existingClaim }}
          {{- else if eq $db.persistence.type "local" }}
          hostPath:
            path: {{ $db.persistence.hostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
  {{- if $usesClaimTemplate }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with $db.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ $db.persistence.accessMode }}
        {{- if $db.persistence.storageClass }}
        storageClassName: {{ $db.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $db.persistence.size }}
  {{- end }}
{{- end }}
