{{- $db := .Values.global.database -}}
{{- if not $db.existingDatabase }}
{{- $secretName := include "database.secretName" . -}}
{{- $namespace := include "database.namespace" . -}}
{{- $existingSecret := lookup "v1" "Secret" $namespace $secretName -}}
{{- $password := randAlphaNum 32 -}}
{{- if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "POSTGRES_PASSWORD") -}}
{{- $password = index $existingSecret.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
# ============================================================================
# PostgreSQL credentials for the database THIS CHART deploys.
# The password is generated on first install and reused from the existing
# Secret during upgrades. After install, view it with:
#   kubectl -n <namespace> get secret {{ include "database.secretName" . }} -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
# The backend reads these same values from this Secret to build its DATABASE_URL.
# (For an EXISTING database, set existingDatabase: true and put the
#  connection/password in values.yaml instead — this Secret is not created.)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "database.secretName" . }}
  namespace: {{ include "database.namespace" . }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
  annotations:
    # Never let Helm delete this Secret — not on uninstall, and not when this
    # template stops rendering because existingDatabase switched to true. The
    # PVC holding the actual Postgres data already survives both of those
    # (StatefulSet PVCs aren't Helm-tracked), so this Secret's password must
    # survive them too, or the two drift apart: a freshly generated password
    # gets paired with a data directory that was initialized under the old
    # one, and every connection fails with a password mismatch.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  POSTGRES_USER: {{ "cloudcost" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  POSTGRES_DB: {{ "cloudcost_db" | b64enc | quote }}
{{- end }}
