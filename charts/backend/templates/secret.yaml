{{- if not .Values.secrets.existingSecret }}
{{- $encoding := .Values.secrets.encoding | default "plain" -}}
{{- if not (has $encoding (list "plain" "base64")) -}}
{{- fail "backend.secrets.encoding must be either \"plain\" or \"base64\"" -}}
{{- end -}}
{{- $secretKey := .Values.secrets.secretKey -}}
{{- $googleClientId := .Values.secrets.googleClientId -}}
{{- $googleClientSecret := .Values.secrets.googleClientSecret -}}
{{- $smtpUser := .Values.secrets.smtpUser -}}
{{- $smtpPassword := .Values.secrets.smtpPassword -}}
{{- $base64Pattern := `^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$` -}}
{{- if eq $encoding "base64" -}}
{{- range $name, $value := dict "secretKey" $secretKey "googleClientId" $googleClientId "googleClientSecret" $googleClientSecret "smtpUser" $smtpUser "smtpPassword" $smtpPassword -}}
{{- if and $value (not (regexMatch $base64Pattern $value)) -}}
{{- fail (printf "backend.secrets.%s must be valid Base64 when backend.secrets.encoding is \"base64\"" $name) -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- $secretKey = $secretKey | b64enc -}}
{{- $googleClientId = $googleClientId | b64enc -}}
{{- $googleClientSecret = $googleClientSecret | b64enc -}}
{{- $smtpUser = $smtpUser | b64enc -}}
{{- $smtpPassword = $smtpPassword | b64enc -}}
{{- end -}}
{{- $databaseUrlEncoding := .Values.global.database.urlEncoding | default "plain" -}}
{{- if not (has $databaseUrlEncoding (list "plain" "base64")) -}}
{{- fail "global.database.urlEncoding must be either \"plain\" or \"base64\"" -}}
{{- end -}}
{{- $databaseUrl := include "backend.databaseUrl" . -}}
{{- if and .Values.global.database.existingDatabase (not $databaseUrl) -}}
{{- fail "global.database.url must be set when global.database.existingDatabase is true" -}}
{{- end -}}
{{- if and .Values.global.database.existingDatabase (eq $databaseUrlEncoding "base64") (not (regexMatch $base64Pattern $databaseUrl)) -}}
{{- fail "global.database.url must be valid Base64 when global.database.urlEncoding is \"base64\"" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.global.database.existingDatabase }}
  # Existing DB URL supports plain or Base64 input through global.database.urlEncoding.
  DATABASE_URL: {{ ternary $databaseUrl ($databaseUrl | b64enc) (eq $databaseUrlEncoding "base64") | quote }}
  {{- end }}
  SECRET_KEY: {{ $secretKey | quote }}
  GOOGLE_CLIENT_ID: {{ $googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ $googleClientSecret | quote }}
  SMTP_USER: {{ $smtpUser | quote }}
  SMTP_PASSWORD: {{ $smtpPassword | quote }}
{{- end }}
