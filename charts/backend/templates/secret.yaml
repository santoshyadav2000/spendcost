{{- $encoding := .Values.secrets.encoding | default "plain" -}}
{{- if not (has $encoding (list "plain" "base64")) -}}
{{- fail "backend.secrets.encoding must be either \"plain\" or \"base64\"" -}}
{{- end -}}
{{- $smtpUser := .Values.secrets.smtpUser -}}
{{- $smtpPassword := .Values.secrets.smtpPassword -}}
{{- if or (not $smtpUser) (not $smtpPassword) -}}
{{- fail "backend.secrets.smtpUser and backend.secrets.smtpPassword must both be set. SMTP is required for login to work at all (the app sends OTP/verification emails as part of login) — this is not optional." -}}
{{- end -}}
{{/* secretKey: auto-generated and persisted across upgrades if left unset in
     values.yaml, matching the same lookup-based pattern already used for
     the bundled Postgres password (database/templates/secret.yaml). A
     static shipped placeholder here is a real security risk — this is the
     JWT signing key (see README) — unlike SMTP/DB config, which just breaks
     visibly when wrong. A default value here is silently exploitable
     instead of visibly broken. Matches the pattern used by Bitnami,
     GitLab, and OpenObserve for this same class of value. */}}
{{- $secretKey := .Values.secrets.secretKey -}}
{{- $secretKeyIsPlainText := eq $encoding "plain" -}}
{{- if not $secretKey -}}
{{- $existingBackendSecret := lookup "v1" "Secret" (include "backend.namespace" .) (include "backend.secretName" .) -}}
{{- if and $existingBackendSecret $existingBackendSecret.data (hasKey $existingBackendSecret.data "SECRET_KEY") -}}
{{- $secretKey = index $existingBackendSecret.data "SECRET_KEY" | b64dec -}}
{{- else -}}
{{- $secretKey = randAlphaNum 64 -}}
{{- end -}}
{{- $secretKeyIsPlainText = true -}}
{{- end -}}
{{- $base64Pattern := `^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$` -}}
{{- if eq $encoding "base64" -}}
{{- range $name, $value := dict "smtpUser" $smtpUser "smtpPassword" $smtpPassword -}}
{{- if and $value (not (regexMatch $base64Pattern $value)) -}}
{{- fail (printf "backend.secrets.%s must be valid Base64 when backend.secrets.encoding is \"base64\"" $name) -}}
{{- end -}}
{{- end -}}
{{- if and (not $secretKeyIsPlainText) (not (regexMatch $base64Pattern $secretKey)) -}}
{{- fail "backend.secrets.secretKey must be valid Base64 when backend.secrets.encoding is \"base64\"" -}}
{{- end -}}
{{- else -}}
{{- $smtpUser = $smtpUser | b64enc -}}
{{- $smtpPassword = $smtpPassword | b64enc -}}
{{- end -}}
{{- if $secretKeyIsPlainText -}}
{{- $secretKey = $secretKey | b64enc -}}
{{- end -}}
{{- $databaseUrlEncoding := .Values.global.database.urlEncoding | default "plain" -}}
{{- if not (has $databaseUrlEncoding (list "plain" "base64")) -}}
{{- fail "global.database.urlEncoding must be either \"plain\" or \"base64\"" -}}
{{- end -}}
{{- $databaseUrl := include "backend.databaseUrl" . -}}
{{- if and .Values.global.database.existingDatabase (not $databaseUrl) -}}
{{- fail "global.database.url must be set when global.database.existingDatabase is true" -}}
{{- end -}}
{{- if and .Values.global.database.existingDatabase (eq $databaseUrlEncoding "base64") (not (regexMatch $base64Pattern $databaseUrl)) -}}
{{- fail "global.database.url must be valid Base64 when global.database.urlEncoding is \"base64\"" -}}
{{- end -}}
{{/* Shape-check the URL (plain mode only — a base64 value can't be format-checked
     before decoding). Each piece is checked individually so a missing/wrong
     part gets a specific, actionable message instead of one generic
     "doesn't match" error. This catches a URL that's present but malformed —
     it cannot verify the host is reachable or the password is correct; that
     is only ever discovered when the migration Job actually connects. */}}
{{- if and .Values.global.database.existingDatabase (eq $databaseUrlEncoding "plain") -}}
{{- if not (hasPrefix "postgresql+asyncpg://" $databaseUrl) -}}
{{- fail (printf "global.database.url must start with \"postgresql+asyncpg://\" — got: %s" $databaseUrl) -}}
{{- end -}}
{{- $urlRest := trimPrefix "postgresql+asyncpg://" $databaseUrl -}}
{{- if not (contains "@" $urlRest) -}}
{{- fail "global.database.url is missing \"@\" — expected format: postgresql+asyncpg://user:password@host:port/dbname" -}}
{{- end -}}
{{- $urlAtParts := splitn "@" 2 $urlRest -}}
{{- $urlCreds := $urlAtParts._0 -}}
{{- $urlHostPart := $urlAtParts._1 -}}
{{- if not (contains ":" $urlCreds) -}}
{{- fail "global.database.url is missing the password — expected user:password before the @ symbol" -}}
{{- end -}}
{{- $urlCredParts := splitn ":" 2 $urlCreds -}}
{{- if not $urlCredParts._0 -}}
{{- fail "global.database.url is missing the username (before the first colon)" -}}
{{- end -}}
{{- if not $urlCredParts._1 -}}
{{- fail "global.database.url is missing the password (after the first colon and before @)" -}}
{{- end -}}
{{- if not (contains ":" $urlHostPart) -}}
{{- fail "global.database.url is missing the port — expected host:port after the @ symbol" -}}
{{- end -}}
{{- if not (contains "/" $urlHostPart) -}}
{{- fail "global.database.url is missing the database name — expected a / followed by the database name at the end" -}}
{{- end -}}
{{- $urlHostParts := splitn ":" 2 $urlHostPart -}}
{{- if not $urlHostParts._0 -}}
{{- fail "global.database.url is missing the host (between @ and :port)" -}}
{{- end -}}
{{- $urlPortDbParts := splitn "/" 2 $urlHostParts._1 -}}
{{- if not $urlPortDbParts._0 -}}
{{- fail "global.database.url is missing the port number (between host: and /dbname)" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9]+$" $urlPortDbParts._0) -}}
{{- fail (printf "global.database.url has an invalid port %q — must be numeric" $urlPortDbParts._0) -}}
{{- end -}}
{{- if not $urlPortDbParts._1 -}}
{{- fail "global.database.url is missing the database name (after the final /)" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.global.database.existingDatabase }}
  # Existing DB URL supports plain or Base64 input through global.database.urlEncoding.
  DATABASE_URL: {{ ternary $databaseUrl ($databaseUrl | b64enc) (eq $databaseUrlEncoding "base64") | quote }}
  {{- end }}
  SECRET_KEY: {{ $secretKey | quote }}
  SMTP_USER: {{ $smtpUser | quote }}
  SMTP_PASSWORD: {{ $smtpPassword | quote }}
  GOOGLE_CLIENT_ID: ""  # Hardcoded empty (not configurable via values.yaml)
  GOOGLE_CLIENT_SECRET: ""  # Hardcoded empty (not configurable via values.yaml)
