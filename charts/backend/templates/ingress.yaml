{{- if or .Values.ingress.enabled (and (.Values.global).ingress.enabled .Values.ingress.host) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backend.fullname" . }}
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  {{- $ann := merge (deepCopy .Values.ingress.annotations) (default (dict) (.Values.global).ingress.annotations) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $class := include "backend.ingressClassName" . }}
  {{- if $class }}
  ingressClassName: {{ $class }}
  {{- end }}
  {{- if or .Values.ingress.tls.enabled (.Values.global).ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | default (.Values.global).ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "backend.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
