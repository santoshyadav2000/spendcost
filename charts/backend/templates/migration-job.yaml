{{/* Schema migrations are mandatory: the backend cannot run without its schema,
     so this Job is always created and is not exposed in values.yaml.

     Hook is post-install,post-upgrade (NOT pre-upgrade — that was tried and
     reverted). pre-upgrade runs this Job before Helm applies ANY of the
     upgrade's main resources, including the bundled Postgres StatefulSet
     itself. That's fine on a steady-state upgrade (Postgres already exists
     from the previous revision) but deadlocks the moment bundled Postgres is
     being created for the first time as part of an upgrade (e.g. switching
     global.database.existingDatabase from true to false): wait-for-db waits
     for a Postgres pod that Helm hasn't created yet, because creating it is
     one of the main resources that only happens AFTER the pre-upgrade hook
     finishes. Real circular deadlock, no --wait flag needed to trigger it.

     The backend's own wait-for-migrations init container (workload.yaml)
     already fully closes the original race condition (backend's
     create_all() vs this Job) on its own, on both first install and every
     upgrade — so pre-upgrade here was redundant protection, not required,
     and not worth the deadlock it introduced. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backend.fullname" . }}-migrate
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.migrations.waitForDb (not .Values.global.database.existingDatabase) }}
      initContainers:
        - name: wait-for-db
          image: {{ include "backend.image" . }}
          imagePullPolicy: {{ include "backend.pullPolicy" . }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "backend.dbHost" . }} -p {{ .Values.global.database.service.port }}; do
                echo "waiting for db..."; sleep 3;
              done
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: alembic-upgrade
          image: {{ include "backend.image" . }}
          imagePullPolicy: {{ include "backend.pullPolicy" . }}
          workingDir: /app
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if not .Values.global.database.existingDatabase }}
          env:
            {{- include "backend.dbEnv" . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "backend.configName" . }}
            - secretRef:
                name: {{ include "backend.secretName" . }}
          command:
            - python
            - -c
            - |
              import os
              import sys
              from alembic.config import Config
              from alembic import command
              from alembic.script import ScriptDirectory
              from alembic.runtime.migration import MigrationContext
              
              print("=" * 60)
              print("DATABASE MIGRATION STARTING")
              print("=" * 60)
              
              try:
                  # ============================================================
                  # STEP 1: Create PostgreSQL Extensions
                  # Required by the application (uuid_generate_v4, crypto
                  # helpers). Idempotent, so not a user-facing option.
                  # ============================================================
                  from sqlalchemy import create_engine, text
                  print("\n[1/3] Creating PostgreSQL extensions...")
                  _sync = os.environ["DATABASE_URL"].replace("+asyncpg", "+psycopg2")
                  _eng = create_engine(_sync)
                  with _eng.begin() as _c:
                      for _ext in ("uuid-ossp", "pgcrypto"):
                          print(f"  → Creating extension: {_ext}")
                          _c.execute(text(f'CREATE EXTENSION IF NOT EXISTS "{_ext}"'))
                          print(f"    ✓ Extension '{_ext}' ready")
                  print("✓ All extensions ensured: uuid-ossp, pgcrypto")
                  
                  # ============================================================
                  # STEP 2: Check Current Database Schema Version
                  # ============================================================
                  print("\n[2/3] Checking current database schema...")
                  cfg = Config("alembic.ini")
                  cfg.set_main_option("sqlalchemy.url", os.environ["DATABASE_URL"])
                  script = ScriptDirectory.from_config(cfg)
                  
                  with _eng.begin() as conn:
                      context = MigrationContext.configure(conn)
                      
                      # Get current revision(s) - handles multiple heads in DB
                      current_revs = context.get_current_heads()  # Returns list, not single value
                      
                      # Get all target heads from migration files
                      target_heads = script.get_heads()
                      
                      if len(target_heads) == 1:
                          print(f"  Current DB revision(s): {', '.join(current_revs) if current_revs else '(empty - fresh database)'}")
                          print(f"  Target revision:        {target_heads[0]}")
                      else:
                          print(f"  Current DB revision(s): {', '.join(current_revs) if current_revs else '(empty - fresh database)'}")
                          print(f"  ⚠ Multiple target heads found: {', '.join(target_heads)}")
                          print(f"  → Will upgrade to all heads (merge needed later)")
                      
                      if set(current_revs) == set(target_heads):
                          print("  ℹ Database is already at all target revisions")
                      elif any(rev in target_heads for rev in current_revs):
                          print("  ℹ Database is at some target revisions, will upgrade remaining")
                      elif current_revs:
                          print(f"  → Migration needed: {', '.join(current_revs)} → heads")
                      else:
                          print(f"  → Fresh database, will apply all migrations")
                  
                  _eng.dispose()
                  
                  # ============================================================
                  # STEP 3: Run Alembic Migrations
                  # ============================================================
                  print("\n[3/3] Running Alembic migrations...")
                  command.upgrade(cfg, "heads")
                  
                  print("\n" + "=" * 60)
                  print("✓ DATABASE MIGRATION COMPLETED SUCCESSFULLY")
                  print("=" * 60)
                  sys.exit(0)
                  
              except Exception as e:
                  print("\n" + "=" * 60, file=sys.stderr)
                  print("✗ DATABASE MIGRATION FAILED", file=sys.stderr)
                  print("=" * 60, file=sys.stderr)
                  print(f"\nError: {e}", file=sys.stderr)
                  print("\nFull traceback:", file=sys.stderr)
                  import traceback
                  traceback.print_exc()
                  print("\n" + "=" * 60, file=sys.stderr)
                  sys.exit(1)
