{{- $isSts := eq .Values.workload.kind "StatefulSet" }}
{{- $dynamic := has .Values.persistence.type (list "pvc" "azureDisk" "azureFile" "azureBlob") }}
{{- $stsClaimTemplate := and $isSts .Values.persistence.enabled $dynamic (not .Values.persistence.existingClaim) }}
apiVersion: apps/v1
kind: {{ .Values.workload.kind }}
metadata:
  name: {{ include "backend.fullname" . }}
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  {{- if $isSts }}
  serviceName: {{ include "backend.fullname" . }}
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.workload.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.workload.revisionHistoryLimit }}
  {{- if not $isSts }}
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "backend.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $hasWaitForDb := not .Values.global.database.existingDatabase }}
      {{- $hasSchemaGate := .Values.migrations.gateBackendOnSchema }}
      {{- if or $hasWaitForDb $hasSchemaGate }}
      initContainers:
        {{- if $hasWaitForDb }}
        - name: wait-for-db
          image: {{ include "backend.image" . }}
          imagePullPolicy: {{ include "backend.pullPolicy" . }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for database {{ include "backend.dbHost" . }}:{{ .Values.global.database.service.port }} ..."
              until pg_isready -h {{ include "backend.dbHost" . }} -p {{ .Values.global.database.service.port }}; do
                sleep 3
              done
              echo "Database is ready."
        {{- end }}
        {{- if $hasSchemaGate }}
        - name: wait-for-migrations
          {{/* Blocks the real "backend" container from starting until the
               schema is at the migration Job's target revision(s). Closes
               the race where this pod's own startup (init_db -> create_all)
               could otherwise run before/alongside the migration Job and
               collide with it (DuplicateTableError), on first install and
               on any upgrade alike. Read-only: never writes to the schema
               itself, only checks it. */}}
          image: {{ include "backend.image" . }}
          imagePullPolicy: {{ include "backend.pullPolicy" . }}
          workingDir: /app
          {{- if not .Values.global.database.existingDatabase }}
          env:
            {{- include "backend.dbEnv" . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "backend.configName" . }}
            - secretRef:
                name: {{ include "backend.secretName" . }}
          command:
            - python
            - -c
            - |
              import os
              import sys
              import time

              from alembic.config import Config
              from alembic.script import ScriptDirectory
              from alembic.runtime.migration import MigrationContext
              from sqlalchemy import create_engine

              cfg = Config("alembic.ini")
              target_heads = set(ScriptDirectory.from_config(cfg).get_heads())
              sync_url = os.environ["DATABASE_URL"].replace("+asyncpg", "+psycopg2")

              max_attempts = {{ .Values.migrations.schemaWaitAttempts | default 100 }}
              interval_seconds = 5

              for attempt in range(1, max_attempts + 1):
                  try:
                      engine = create_engine(sync_url)
                      with engine.connect() as conn:
                          current_heads = set(MigrationContext.configure(conn).get_current_heads())
                      engine.dispose()
                      if current_heads == target_heads:
                          print(f"Schema is at target revision(s) {sorted(target_heads)}. Continuing.")
                          sys.exit(0)
                      print(
                          f"[{attempt}/{max_attempts}] schema not ready yet "
                          f"(have {sorted(current_heads) or 'none'}, want {sorted(target_heads)}); waiting..."
                      )
                  except Exception as exc:
                      print(f"[{attempt}/{max_attempts}] database not reachable yet: {exc}")
                  time.sleep(interval_seconds)

              print("Timed out waiting for the migration Job to finish.", file=sys.stderr)
              sys.exit(1)
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "backend.image" . }}
          imagePullPolicy: {{ include "backend.pullPolicy" . }}
          {{- with .Values.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName | default "http" }}
              containerPort: {{ .Values.service.targetPort }}
          {{- if not .Values.global.database.existingDatabase }}
          env:
            {{- include "backend.dbEnv" . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "backend.configName" . }}
            - secretRef:
                name: {{ include "backend.secretName" . }}
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.portName | default "http" }}
            periodSeconds: {{ .Values.probes.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.probes.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.portName | default "http" }}
            periodSeconds: {{ .Values.probes.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.probes.readinessProbe.successThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.service.portName | default "http" }}
            periodSeconds: {{ .Values.probes.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.probes.livenessProbe.successThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.persistence.enabled (not $stsClaimTemplate) }}
      volumes:
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else if eq .Values.persistence.type "local" }}
          hostPath:
            path: {{ .Values.persistence.hostPath }}
            type: DirectoryOrCreate
          {{- else if eq .Values.persistence.type "emptyDir" }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "backend.fullname" . }}-data
          {{- end }}
      {{- end }}
  {{- if $stsClaimTemplate }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
