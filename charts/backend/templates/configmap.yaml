apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.configName" . }}
  namespace: {{ include "backend.namespace" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  BCRYPT_SALT_ROUND: {{ .Values.config.bcryptSaltRound | quote }}
  BATCH_SIZE: {{ .Values.config.batchSize | quote }}
  MAX_DELETE: {{ .Values.config.maxDelete | quote }}
  SMTP_SERVER: {{ .Values.config.smtp.server | quote }}
  SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  REDIRECT_URI: ""  # Hardcoded empty (not configurable via values.yaml)
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
