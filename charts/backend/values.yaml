# ============================================================================
# backend — FastAPI (Uvicorn) + in-process background workers
# ============================================================================
enabled: true

namespaceOverride: ""
nameOverride: ""
fullnameOverride: ""

image:
  registry: ""            # "" -> image already on node; else e.g. docker.io/santosh1031
  repository: cloudcost-backend
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []         # e.g. [ { name: acr-pull-secret } ] for a private registry

# --- Workload shape (fully dynamic) -----------------------------------------
# kind: Deployment (default) or StatefulSet.
# NOTE: the app starts background workers in-process, so running more than one
# replica will duplicate scheduled jobs. Keep replicaCount at 1 unless you
# externalise the workers.
workload:
  kind: Deployment
  replicaCount: 1
  strategy:
    type: RollingUpdate      # for Deployment
  revisionHistoryLimit: 5

command: []                  # override container command if needed
args: []

service:
  annotations: {}
  type: ClusterIP
  port: 8000
  targetPort: 8000

# --- Application config (non-secret) ----------------------------------------
config:
  logLevel: "ERROR"
  bcryptSaltRound: 12
  batchSize: 100
  maxDelete: 500
  # Google OAuth callback — AUTO-DERIVED from the ingress host when set
  # (https://<host>/api/auth/google/callback). Empty = Google login off / IP mode.
  redirectUri: ""
  smtp:
    server: "smtp.gmail.com"
    port: 587
  # Free-form extra env (rendered into ConfigMap)
  extraEnv: {}

# --- Database connection ----------------------------------------------------
# NOTE: all database settings live in ONE place: global.database (top-level
# values.yaml). The backend helpers read the connection details from there.

# --- Secrets ----------------------------------------------------------------
# When existingSecret is set, all sensitive env is sourced from it (keys must
# match the names used by the app). Otherwise a Secret is generated from the
# values below. Select whether those values are plain text or already Base64.
secrets:
  existingSecret: ""
  # plain: Helm encodes values for Kubernetes Secret.data.
  # base64: values must already be valid Base64.
  encoding: "plain"
  secretKey: "change-me-please-generate-a-strong-key"
  googleClientId: ""
  googleClientSecret: ""
  smtpUser: ""
  smtpPassword: ""

# --- Database migrations (Helm hook Job: alembic upgrade head) --------------
migrations:
  enabled: true
  # Waits for the DB TCP port before running.
  waitForDb: true
  # PostgreSQL extensions ensured (CREATE EXTENSION IF NOT EXISTS) before the
  # migrations run. Set to [] to disable — the step is then omitted and does
  # not affect the migration logic.
  extensions:
    - uuid-ossp
    - pgcrypto

# --- Persistence (billing CSV assets written to src/jobs/assets) ------------
persistence:
  enabled: false
  type: pvc                  # pvc | azureDisk | azureFile | azureBlob | local | emptyDir
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /app/src/jobs/assets
  annotations: {}
  hostPath: /mnt/data/cloudcost-assets
  existingClaim: ""

# --- Ingress (list form: hosts[] each with paths[], tls[]) ------------------
ingress:
  enabled: false
  className: ""              # ingress controller class, e.g. "nginx". "" = cluster default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2   # preserve the backend's /api prefix
  hosts:
    - host: ""               # "" = catch-all on the ingress IP (HTTP)
      paths:
        - path: /api(/|$)(.*)   # backend served under /api
          pathType: ImplementationSpecific
  tls: []                    # e.g. [ { secretName: my-tls, hosts: [ my.host ] } ]

# --- Autoscaling (disabled by default because of in-process workers) --------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# --- PodDisruptionBudget (default OFF) --------------------------------------
# Keep DISABLED for the backend: it runs a single replica (in-process
# background workers), and a PDB on a 1-replica app would BLOCK node drains
# during cluster maintenance/upgrades.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  enabled: true
  path: /
  initialDelaySeconds: 20
  periodSeconds: 15

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
