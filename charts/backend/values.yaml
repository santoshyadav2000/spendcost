# ============================================================================
# backend — FastAPI (Uvicorn) + in-process background workers
# ============================================================================
enabled: true

namespaceOverride: ""
nameOverride: ""
fullnameOverride: ""

image:
  registry: ""            # "" -> image already on node; else e.g. docker.io/santosh1031
  repository: cloudcost-backend
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []         # e.g. [ { name: acr-pull-secret } ] for a private registry

# --- Workload shape (fully dynamic) -----------------------------------------
# kind: Deployment (default) or StatefulSet.
# NOTE: the app starts background workers in-process, so running more than one
# replica will duplicate scheduled jobs. Keep replicaCount at 1 unless you
# externalise the workers.
workload:
  kind: Deployment
  replicaCount: 1
  strategy:
    type: RollingUpdate      # for Deployment
  revisionHistoryLimit: 5

command: []                  # override container command if needed
args: []

service:
  annotations: {}
  type: ClusterIP
  port: 8000
  targetPort: 8000

# --- Application config (non-secret) ----------------------------------------
config:
  logLevel: "ERROR"
  bcryptSaltRound: 12
  batchSize: 100
  maxDelete: 500
  smtp:
    server: "smtp.gmail.com"
    port: 587
  # Free-form extra env (rendered into ConfigMap)
  extraEnv: {}

# --- Database connection ----------------------------------------------------
# NOTE: all database settings live in ONE place: global.database (top-level
# values.yaml). The backend helpers read the connection details from there.

# --- Secrets ----------------------------------------------------------------
# Sensitive values stored in a Kubernetes Secret. Select whether values are
# plain text (Helm encodes them) or already Base64-encoded.
secrets:
  # plain: Helm encodes values for Kubernetes Secret.data.
  # base64: values must already be valid Base64.
  encoding: "plain"
  # Leave empty to auto-generate a random 64-character key on first install
  # (persisted across upgrades — same pattern as the bundled Postgres
  # password). Only set this yourself if you need a specific value, e.g. to
  # share one signing key across multiple deployments.
  secretKey: ""
  # Which channel sends login/OTP/verification emails: "smtp" or "sendgrid".
  # Only the fields for the selected provider are required below.
  smtpProvider: "smtp"
  smtpUser: ""
  smtpPassword: ""
  # Used only when smtpProvider: "sendgrid".
  sendgridApiKey: ""
  sendgridFromEmail: ""

# --- Database migrations (Helm hook Job: alembic upgrade heads) -------------
# The migration Job and its PostgreSQL extensions are mandatory and hardcoded
# in charts/backend/templates/migration-job.yaml — nothing to enable here.
migrations:
  # Waits for the DB TCP port before the migration/backend containers start.
  waitForDb: true
  # Job retries on failure. A bad DATABASE_URL, wrong credentials, or a
  # missing database/role/extension is a config error and won't be fixed by
  # retrying — this small buffer is only to absorb rare transient infra
  # blips (e.g. a brief network hiccup to an external DB, which has no
  # wait-for-db init container to protect it).
  backoffLimit: 2
  # Hard wall-clock cap on the whole Job (covers wait-for-db + the migration
  # itself), independent of backoffLimit. Without this, a Postgres that never
  # becomes ready (crash-looping, bad image, stuck PVC) makes the wait-for-db
  # init container loop forever — the Job never fails on its own, and
  # `helm upgrade --install` (which has no --timeout by default) hangs
  # indefinitely instead of reporting an error. Raise this if legitimate
  # cold-start times (e.g. large PVC provisioning) exceed the default.
  activeDeadlineSeconds: 3600
  # Adds a wait-for-migrations init container to the backend pod: it blocks
  # the real backend container from starting until the database schema is
  # confirmed at the migration Job's target revision(s). Without this, the
  # backend's own startup code (which also creates any tables it doesn't
  # find) can start at the same time as the migration Job and collide with
  # it. Applies on every deploy, including the very first install (the one
  # case the migration Job's own pre-upgrade hook timing can't cover).
  gateBackendOnSchema: true
  # Max poll attempts for wait-for-migrations, 5s apart (default: ~8 minutes)
  # before it gives up and fails the backend pod's startup with a clear error.
  schemaWaitAttempts: 100
  # Resource requests/limits for the migration Job's containers (wait-for-db +
  # alembic-upgrade). Without this, the Job runs as BestEffort QoS — the
  # first thing evicted if the node comes under memory pressure for any
  # reason, even one unrelated to this Job. The Job only ever runs DDL
  # (CREATE/ALTER TABLE) through a single connection for under a minute, so
  # this is comfortably above its realistic footprint without copying the
  # much heavier steady-state backend container's own limits.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Persistence (billing CSV assets written to src/jobs/assets) ------------
persistence:
  enabled: false
  type: pvc                  # pvc | azureDisk | azureFile | azureBlob | local | emptyDir
  size: 5Gi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /app/src/jobs/assets
  annotations: {}
  hostPath: /mnt/data/cloudcost-assets
  existingClaim: ""

# --- Ingress (list form: hosts[] each with paths[], tls[]) ------------------
ingress:
  enabled: false
  className: ""              # ingress controller class, e.g. "nginx". "" = cluster default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /api/$2   # preserve the backend's /api prefix
  hosts:
    - host: ""               # "" = catch-all on the ingress IP (HTTP)
      paths:
        - path: /api(/|$)(.*)   # backend served under /api
          pathType: ImplementationSpecific
  tls: []                    # e.g. [ { secretName: my-tls, hosts: [ my.host ] } ]

# --- Autoscaling (disabled by default because of in-process workers) --------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# --- PodDisruptionBudget (default OFF) --------------------------------------
# Keep DISABLED for the backend: it runs a single replica (in-process
# background workers), and a PDB on a 1-replica app would BLOCK node drains
# during cluster maintenance/upgrades.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  enabled: true
  path: /
  # Gates readiness/liveness until the app has started successfully once.
  # Separate from (and after) the wait-for-migrations init container — this
  # covers the FastAPI app's own boot time (routes, background workers).
  startupProbe:
    periodSeconds: 5
    failureThreshold: 30       # 5s x 30 = 150s startup budget
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    periodSeconds: 15
    timeoutSeconds: 5          # was implicitly 1s — too tight, caused false-positive restarts
    failureThreshold: 3
    successThreshold: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
