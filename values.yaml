# ############################################################################
# CloudCost — Helm configuration
# ----------------------------------------------------------------------------
# THIS IS THE ONLY FILE YOU NEED TO EDIT.
#
# It configures the whole platform: PostgreSQL database, FastAPI backend, and
# the React/nginx frontend. The same file works in ANY environment — dev, test,
# staging or production. There are no separate per-environment files: you set
# the values below to match wherever you are installing.
#
# Install / upgrade:
#   helm upgrade --install cloudcost .
#
# Override a single value at install time without editing the file:
#   helm upgrade --install cloudcost . --set backend.image.tag=v1.2.3
# ############################################################################


# ============================================================================
# 1. GLOBAL  — shared by all three components
# ============================================================================
global:
  namespace:
    name: cloudcost-test         # Kubernetes namespace everything is installed into

  # ==========================================================================
  database:
    # Mode:
    #   existingDatabase: false -> the chart DEPLOYS PostgreSQL. Credentials are
    #        defined in charts/database/templates/secret.yaml and stored in the
    #        Secret <release>-postgres-auth; the backend reads them from there.
    #        Nothing to set here (view creds: kubectl get secret <release>-postgres-auth).
    #   existingDatabase: true  -> use an EXISTING database. Put the FULL
    #        connection string in `url` below (host, port, user, password, db all
    #        live inside it) — no other connection fields are needed.
    existingDatabase: false

    # Connection string for an EXISTING database (used only when
    # existingDatabase: true). URL-encode special chars in the password
    # ( @->%40  #->%23  $->%24  &->%26 ). Leave empty when existingDatabase: false.
    # urlEncoding:
    #   plain  -> enter a normal DATABASE_URL; Helm encodes it for Kubernetes Secret.data.
    #   base64 -> enter a DATABASE_URL that is already Base64-encoded.
    urlEncoding: "plain"
    # Example: "postgresql+asyncpg://user:pass@myhost:5432/cloudcost_db"
    #url: ""

    # --- Settings for the PostgreSQL WE deploy (only when existingDatabase: false) ---
    image:
      registry: "docker.io/library"   # official image (not your personal registry)
      repository: "postgres"
      tag: "16-alpine"
      pullPolicy: "IfNotPresent"
      pullSecrets: []                 # e.g. [ { name: acr-pull-secret } ] for a private registry
    service:
      port: 5432
      type: ClusterIP
    replicaCount: 1
    # Storage for the database files.
    #   type controls how the data volume is provisioned:
    #     pvc        -> dynamic PVC via storageClassName (default k8s path, recommended)
    #     azureDisk  -> Azure Managed Disk CSI   (set storageClass: managed-csi / managed-csi-premium)
    #     azureFile  -> Azure Files CSI (SMB)    (set storageClass: azurefile-csi — NOT recommended for a DB)
    #     azureBlob  -> Azure Blob CSI (blobfuse)(set storageClass: azureblob-fuse-premium)
    #     local      -> node hostPath (single-node / dev only; uses hostPath below)
    #     emptyDir   -> ephemeral, data lost on pod restart (testing only)
    persistence:
      enabled: true
      type: pvc
      size: 20Gi
      accessMode: ReadWriteOnce
      storageClass: ""       # "" = cluster default storage class
      mountPath: /var/lib/postgresql/data
      subPath: pgdata
      annotations: {}        # extra annotations for the PVC / claim template
      hostPath: /mnt/data/cloudcost-postgres   # used only when type=local
      existingClaim: ""      # mount a pre-created PVC instead of provisioning one
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    probes:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    podSecurityContext:
      fsGroup: 999
    securityContext:
      runAsUser: 999
      runAsNonRoot: true

  labels: {}                 # extra labels stamped on every object


# ============================================================================
# 2. BACKEND  — FastAPI API + background workers
# ============================================================================
backend:
  # Where the backend image is pulled from.
  #   registry: ""  -> image is already on the node (offline / docker load)
  #   registry: "docker.io/santosh1031" / "myregistry.azurecr.io" -> pull from there
  image:
    registry: docker.io/santosh1031
    repository: cloudcost-backend
    tag: "latest"
    pullPolicy: Always
    pullSecrets: []          # e.g. [ { name: acr-pull-secret } ] for a private registry

  # The backend runs scheduled jobs INSIDE the process, so it must stay at a
  # single replica (more than one would run duplicate jobs).
  workload:
    kind: Deployment         # Deployment or StatefulSet
    replicaCount: 1

  # Service port the API listens on (internal). Rarely changed.
  service:
    annotations: {}          # optional Kubernetes Service annotations
    type: ClusterIP
    port: 8000               # Service port
    targetPort: 8000         # container port the app listens on

  # NOTE: all database connection settings (in-cluster or external) live in
  # ONE place: global.database (section 1). The backend reads from there.

  # Non-secret application settings.
  config:
    logLevel: "INFO"                 # DEBUG | INFO | WARNING | ERROR
    bcryptSaltRound: 12
    batchSize: 100
    maxDelete: 500
    smtp:
      server: "smtp.gmail.com"
      port: 587
    # Optional worker tuning (leave empty to use built-in defaults).
    # Example: { BILLING_LOAD_WORKERS: "4", AMORTIZED_LOAD_WORKERS: "4" }
    extraEnv: {}

  # Sensitive values -> stored in a Kubernetes Secret (never a ConfigMap).
  secrets:
    # plain: enter normal text; Helm encodes it for Kubernetes Secret.data.
    # base64: enter values that are already Base64-encoded.
    encoding: "base64"
    secretKey: "Y2hhbmdlLW1lLWdlbmVyYXRlLWEtc3Ryb25nLXJhbmRvbS1rZXk="
    smtpUser: "MDgwM3NhbnRvc2h5YWRhdkBnbWFpbC5jb20="
    smtpPassword: "YnN6bXVlem51aXpnc2Jkdg=="

  

  # Optional disk for billing CSV files the workers write to disk.
  persistence:
    enabled: false
    type: pvc                # pvc | azureFile | azureBlob | local | emptyDir
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  # ── Public API URL (Ingress) ──────────────────────────────────────────────
  # Exposes the backend API to the internet. NOTE: your cluster must already
  # have an ingress controller installed (e.g. nginx), and DNS + TLS cert are
  # handled outside this chart. This block only creates the routing rule.
  ingress:
    enabled: true                       # true = create the public route; false = internal only (port-forward)
    className: nginx                     # ingress controller class. "" = cluster default ingress class
    annotations:
      # Strip the /api prefix before forwarding to the backend (nginx-ingress).
      nginx.ingress.kubernetes.io/rewrite-target: /api/$2
      # cert-manager etc. can be added here too, e.g. cert-manager.io/cluster-issuer: letsencrypt-prod
    # Have a DNS domain? UNCOMMENT the host line and set it.
    # No domain? Leave it commented — the API is served on the ingress
    # controller's public IP over HTTP (kubectl -n ingress-nginx get svc).
    # The paths below are REQUIRED (they route the traffic) — do not comment them.
    hosts:
      - #host: cloudcost-api.infrashift.tech
        paths:
          - path: /api(/|$)(.*)          # backend served under /api — works on any IP or domain
            pathType: ImplementationSpecific
    # HTTPS. Add an entry per certificate (needs a real host above). Example:
    #   - secretName: cloudcost-api-tls
    #     hosts: [ cloudcost-api.infrashift.tech ]
    tls: []

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # PodDisruptionBudget — keep DISABLED for the backend.
  # The backend runs 1 replica (in-process background workers). A PDB on a
  # 1-replica app would BLOCK node drains during cluster maintenance, so do
  # NOT enable this unless the backend runs 3+ replicas.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

  # Autoscaling — keep DISABLED for the backend.
  # The backend runs background schedulers in-process; more than one replica
  # would run duplicate scheduled jobs. Do NOT enable unless the app is split
  # into separate API + worker processes (RUN_WORKERS flag).
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80   # scale when avg memory > 80%


# ============================================================================
# 3. FRONTEND  — React app served by nginx
# ============================================================================
frontend:
  # Where the frontend image is pulled from.
  #   registry: ""  -> image is already on the node (offline / docker load)
  #   registry: "docker.io/santosh1031" / "myregistry.azurecr.io" -> pull from there
  image:
    registry: docker.io/santosh1031
    repository: cloudcost-ui           # your built UI image
    tag: "latest"
    pullPolicy: Always
    pullSecrets: []          # e.g. [ { name: acr-pull-secret } ] for a private registry

  replicaCount: 1

  # Internal frontend Service. Ingress sends public traffic to port 8080 here;
  # the Service forwards it to nginx inside the container on port 80.
  service:
    annotations: {}          # optional Kubernetes Service annotations
    type: ClusterIP
    port: 8080                 # Kubernetes Service port, used by Ingress inside the cluster
    targetPort: 80             # container port where nginx listens inside the frontend pod

  # The frontend calls the backend at this URL. It is injected at startup, so
  # you do NOT need to rebuild the image to point at a different backend.
  #   apiBaseUrl  -> the PUBLIC backend URL the browser should call
  #   replaceFrom -> the URL that was baked in when the image was built
  #                  (the default build uses http://127.0.0.1:8000)
  runtimeConfig:
    enabled: true
    apiBaseUrl: "/"                      # relative: browser calls the current host
    replaceFrom: "http://127.0.0.1:8000"

  # ── Public UI URL (Ingress) ───────────────────────────────────────────────
  # Exposes the web UI to the internet. Same requirements as the backend:
  # an ingress controller must be installed, and DNS + TLS are set up outside
  # this chart. This block only creates the routing rule.
  ingress:
    enabled: true                       # true = create the public route; false = internal only (port-forward)
    className: nginx                     # ingress controller class. "" = cluster default ingress class
    annotations: {}                      # controller / cert-manager settings, e.g. { cert-manager.io/cluster-issuer: letsencrypt-prod }
    # Have a DNS domain? UNCOMMENT the host line and set it.
    # No domain? Leave it commented — the UI is served on the ingress
    # controller's public IP over HTTP (kubectl -n ingress-nginx get svc).
    # The paths below are REQUIRED (they route the traffic) — do not comment them.
    hosts:
      - #host: cloudcost.infrashift.tech
        paths:
          - path: /
            pathType: Prefix
    # HTTPS. Add an entry per certificate (needs a real host above). Example:
    #   - secretName: cloudcost-ui-tls
    #     hosts: [ cloudcost.infrashift.tech ]
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 250m
      memory: 900Mi

  # PodDisruptionBudget — default OFF.
  # Turn ON only when the frontend runs 3+ replicas AND you want zero-downtime
  # during node upgrades. maxUnavailable: 1 evicts pods one at a time and never
  # blocks maintenance. At 1-2 replicas, leave it OFF.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

  # Autoscaling — default OFF.
  # Enable to automatically add/remove frontend pods based on CPU. Safe for the
  # frontend (stateless nginx). minReplicas/maxReplicas set the range.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80  # scale when avg memory > 80%
